name: Daily Journal

on:
  schedule:
    - cron: "30 17 * * *" # 23:00 IST, logs the IST day in progress
  workflow_dispatch:
    inputs:
      date:
        description: "IST date to log (YYYY-MM-DD). Defaults to today."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  log:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.JOURNAL_PAT }}

      - name: Write journal entry
        id: journal
        env:
          GITHUB_TOKEN: ${{ secrets.JOURNAL_PAT }}
          TARGET_DATE: ${{ inputs.date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            python3 scripts/journal.py --date "$TARGET_DATE"
          else
            python3 scripts/journal.py
          fi

      - name: Open a pull request and let it merge itself
        env:
          GH_TOKEN: ${{ secrets.JOURNAL_PAT }}
          ENTRY_DATE: ${{ steps.journal.outputs.date }}
        run: |
          git config user.name "Vineeth N K"
          git config user.email "vineethkrishnan007@gmail.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No change for $ENTRY_DATE, nothing to commit."
            exit 0
          fi

          branch="journal/$ENTRY_DATE"
          git switch -c "$branch"
          git commit -m "docs(journal): log activity for $ENTRY_DATE"
          git push --force --set-upstream origin "$branch"

          if ! gh pr view "$branch" --json number >/dev/null 2>&1; then
            gh pr create \
              --base main \
              --head "$branch" \
              --title "docs(journal): log activity for $ENTRY_DATE" \
              --body "Automated activity log for $ENTRY_DATE, written by \`scripts/journal.py\`. Merges itself once the checks pass."
          fi

          gh pr merge "$branch" --auto --squash --delete-branch
